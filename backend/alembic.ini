# ============================================================
# alembic.ini — Configuración de Alembic (PLACEHOLDER)
# ============================================================
# Alembic es la herramienta de migraciones de SQLAlchemy.
# Permite versionar el esquema de la base de datos.
#
# TODO: Configurar sqlalchemy.url para leer de la env var DATABASE_URL
# TODO: Ajustar script_location si es necesario
# TODO: Definir formato de archivos de migración
# ============================================================

[alembic]
# Ruta a la carpeta de migraciones (relativa a este archivo)
script_location = alembic

# Formato de los nombres de archivos de migración
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# URL de la base de datos (sobrescrita por env.py desde la env var)
sqlalchemy.url = sqlite+aiosqlite:///./kinova.db


# ---------- Logging ----------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
